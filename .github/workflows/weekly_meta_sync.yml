name: Weekly WBO Meta Sync

on:
  schedule:
    # Runs every Friday at 18:00 UTC (after weekly WBO tournaments settle)
    - cron: '0 18 * * 5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-meta:
    name: Sync WBO Meta & Combos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Install Monorepo Dependencies
        run: flutter pub get

      - name: Run Meta Data Synchronization
        run: dart run tool/sync_meta_data.dart

      - name: Quality Gate (Run Domain Unit Tests)
        run: |
          cd packages/bey_domain
          flutter test

      - name: Static Analysis Verification
        run: flutter analyze

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/ packages/bey_catalog/assets/ apps/app_player/assets/ apps/app_organizer/assets/ docs/
          if git diff --staged --quiet; then
            echo "No meta changes to commit this week."
          else
            git commit -m "chore(meta): weekly wbo tournament data sync [skip ci]"
            git push
          fi
