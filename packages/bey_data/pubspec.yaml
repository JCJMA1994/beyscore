version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  bey_domain:
    path: ../bey_domain
  drift: ^2.22.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  supabase_flutter: ^2.8.0
  connectivity_plus: ^7.3.1
  rxdart: ^0.28.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.22.0
  build_runner: ^2.4.14
  very_good_analysis: ^10.2.0
