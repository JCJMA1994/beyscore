name: bey_hub
description: Local LAN Hub (Shelf HTTP & WebSocket server) and QR pairing for BeyScore table devices and live spectator dashboards.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  bey_domain:
    path: ../bey_domain
  crypto: ^3.0.6
  http: ^1.3.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  test: ^1.25.8
  very_good_analysis: ^10.2.0
